[program:myprogram]
cmd=/usr/bin/python3 /path/to/script.py --port 8080
numprocs=3
autostart=true
autorestart=unexpected
exitcodes=0,2
starttime=5
startretries=3
stopsignal=TERM
stoptime=10
stdout=/var/log/myprogram.stdout.log
stderr=/var/log/myprogram.stderr.log
workingdir=/path/to/working/directory
umask=022

[program:myprogram.environment]
ENVIRONMENT=production
LOG_LEVEL=info

[program:otherprogram]
cmd=/usr/bin/nginx -g "daemon off;"
numprocs=1
autostart=true
autorestart=always
exitcodes=0
starttime=2
startretries=5
stopsignal=QUIT
stoptime=5
stdout=discard
stderr=discard
workingdir=/var/www
umask=022