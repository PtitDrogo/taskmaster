[program:myprogram]
command=/usr/bin/python3 ./src/test/script.py
numprocs=3
autostart=true
autorestart=unexpected
exitcodes=0,2
starttime=5
startretries=3
stopsignal=TERM #TERM, HUP, INT, QUIT, KILL, USR1, or USR2 default TERM
stoptime=10
stdout_logfile=/var/log/myprogram.stdout.log
stderr_logfile=/var/log/myprogram.stderr.log
workingdir=/path/to/working/directory
umask=022

[program:myprogram.environment]
ENVIRONMENT=production
LOG_LEVEL=info

[program:otherprogram]
command=/usr/bin/nginx -g "daemon off;"
numprocs=1
autostart=true
autorestart=always
exitcodes=0
starttime=2
startretries=5
stopsignal=QUIT
stoptime=5
stdout_logfile=discard
stderr_logfile=discard
workingdir=/var/www
umask=022