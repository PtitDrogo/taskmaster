[supervisord]
# user=nobody
logfile=/tmp/taskmasterd.log
pidfile=taskmaster.pid

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface


[program:bash]
# user=nobody
command=bash
directory=/tmp
umask=077
environment=FOO="bar",ANSWER="42"
autostart=true
autorestart=unexpected
startsecs=2
stdout_logfile=/tmp/bash.stdout.log
stderr_logfile=/tmp/bash.stderr.log

# numprocs tests here.
[program:numprocs]
command=/bin/sh -c "while true; do sleep 1; done"
# process_name=%(program_name)s_%(process_num)02d
numprocs=3
autostart=true
autorestart=always
startsecs=1
stdout_logfile=/tmp/numprocs.stdout.log
stderr_logfile=/tmp/numprocs.stderr.log


# Testing auto restart rules
[program:EXIT_restart_never]
command=/bin/sh -c "sleep 3; exit 0"
autostart=true
autorestart=never
exitcodes=0
startsecs=1

[program:EXIT_restart_always]
command=/bin/sh -c "sleep 3; exit 0"
autostart=true
autorestart=always
exitcodes=0
startsecs=1


[program:EXIT_test_expected_exit_code]
command=/bin/sh -c "sleep 3; exit 2"
autostart=true
autorestart=unexpected
exitcodes=0,2
startsecs=1

[program:EXIT_test_unexpected]
command=/bin/sh -c "sleep 3; exit 1"
autostart=true
autorestart=unexpected
exitcodes=0,2
startsecs=1

# ------------------

[program:startsecs_ok]
command=/bin/sh -c "while true; do sleep 1; done"
autostart=false
startsecs=5
startretries=3


[program:startretries_fatal]
command=/bin/sh -c "sleep 1; exit 1"
autostart=false
autorestart=unexpected
exitcodes=0
startsecs=3
startretries=3

# Stop - then confirm USR1 in stdout logs
[program:stopsig_graceful]
command=/bin/sh -c "trap 'echo got USR1; exit 0' USR1; while true; do sleep 1 & wait $!; done"
autostart=false
autorestart=never
startsecs=1
stopsignal=USR1
stopwaitsecs=10
stdout_logfile=/tmp/stopsig_graceful.stdout.log
stderr_logfile=/tmp/stopsig_graceful.stderr.log

# Stop, then confirm SIGKILL in logs
[program:stop_killed]
command=/bin/sh -c "trap '' TERM; while true; do sleep 1; done"
autostart=false
autorestart=never
startsecs=1
stopsignal=TERM
stopwaitsecs=4


[program:redirect_files]
command=/bin/sh -c "while true; do echo to stdout; echo to stderr >&2; sleep 1; done"
autostart=false
startsecs=1
stdout_logfile=/tmp/redirect_files.stdout.log
stderr_logfile=/tmp/redirect_files.stderr.log


[program:redirect_discard]
command=/bin/sh -c "while true; do echo to stdout; echo to stderr >&2; sleep 1; done"
autostart=false
startsecs=1
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:failure]
command=/bin/CommandQuiExistePas
autostart=true
startsecs=3
stdout_logfile=/tmp/failure.stdout.log
stderr_logfile=/tmp/failure.stderr.log
