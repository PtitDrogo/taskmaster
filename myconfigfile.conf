; myconfigfile.conf

[unix_http_server]
# file=/tmp/supervisor.sock   ; needed so supervisorctl can talk to supervisord

[supervisord]
# logfile=/tmp/supervisord.log
# logfile="taskmasterd.log"
# pidfile=/tmp/supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock   ; tells supervisorctl how to reach supervisord

