; myconfigfile.conf

[unix_http_server]
file=/tmp/supervisor.sock   ; needed so supervisorctl can talk to supervisord

[supervisord]
# logfile=/tmp/taskmasterd.log
# logfile="taskmasterd.log"
# pidfile=taskmaster.pid
# nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock   ; tells supervisorctl how to reach supervisord

[program:fatal_nocmd]
command=/does/not/exist
autostart=true
startretries=2

