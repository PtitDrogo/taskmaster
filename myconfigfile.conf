; myconfigfile.conf

[unix_http_server]
file=/tmp/supervisor.sock   ; needed so supervisorctl can talk to supervisord

[supervisord]
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock   ; tells supervisorctl how to reach supervisord

[program:sleeper]
command=/bin/sh -c "while true; do echo alive; sleep 2; done"
autostart=true
autorestart=true
startretries=3
stopsignal=HUP
stdout_logfile=/tmp/sleeper.stdout.log
stderr_logfile=/tmp/sleeper.stderr.log
environment=A="1",B="2"

# [program:sleeper.environment]
# ENVIRONMENT=production
# LOG_LEVEL=info

[program:crasher]
command=/bin/sh -c "echo starting; sleep 1; exit 1"
autostart=true
autorestart=unexpected
exitcodes=0
startretries=3
startsecs=3
stdout_logfile=/tmp/crasher.stdout.log
